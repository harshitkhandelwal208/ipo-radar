[project]
name = "ipo-radar"
version = "0.1.0"
license = {text = "MIT"}
description = "Live IPO tracker, multi-market listing-gain model and mobile alerts"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12", "rich>=13", "httpx>=0.27", "selectolax>=0.3", "pandas>=2.2", "pyarrow>=15",
  "numpy>=1.26", "scikit-learn>=1.4", "lightgbm>=4.3", "openpyxl>=3.1", "platformdirs>=4",
  "tomli-w>=1.0",
]
[project.optional-dependencies]
dev = ["pytest>=8", "optuna>=3.6", "shap>=0.45", "huggingface_hub>=0.23"]
[project.scripts]
ipo = "ipo_radar.cli.app:app"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
